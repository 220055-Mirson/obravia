<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>A autenticar...</title>
  <style>
    body { background:#444441; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; font-family:sans-serif; flex-direction:column; gap:1rem; color:white; }
    .spinner { width:40px; height:40px; border:4px solid rgba(255,255,255,0.2); border-top-color:#D85A30; border-radius:50%; animation:spin .7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    p { font-size:14px; color:rgba(255,255,255,0.6); margin:0; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>A autenticar com Google...</p>
  <script>
  (function () {
    try {
      const p     = new URLSearchParams(window.location.search);
      const erro  = p.get('erro');

      if (erro) {
        const msgs = {
          google_cancelado: 'Login com Google cancelado.',
          google_falhou:    'Erro ao autenticar com Google.',
          pendente:         'A sua conta aguarda aprovação.'
        };
        alert(msgs[erro] || 'Erro de autenticação.');
        window.location.replace('login.html');
        return;
      }

      const token   = p.get('token');
      const nome    = decodeURIComponent(p.get('nome') || '');
      const email   = decodeURIComponent(p.get('email') || '');
      const role    = p.get('role') || 'usuario';
      const tipo    = p.get('tipo') || 'cliente';
      const id      = parseInt(p.get('id') || '0');
      const destino = decodeURIComponent(p.get('destino') || 'index.html');

      if (!token) {
        window.location.replace('login.html');
        return;
      }

      const userObj = { id, nome, email, role, tipo, status: 'aprovado' };

      // Escrever tudo corretamente no localStorage usando a variável 'nome'
      localStorage.setItem('token',         token);
      localStorage.setItem('authToken',     token);
      localStorage.setItem('usuarioLogado', nome);
      localStorage.setItem('role',          role || 'usuario');
      localStorage.setItem('user',          JSON.stringify(userObj));

      // Confirmar que foi escrito antes de redirecionar
      const check = localStorage.getItem('token');
      if (check === token) {
        window.location.replace(destino.startsWith('/') ? destino : '/' + destino);
      } else {
        setTimeout(() => window.location.replace(destino), 300);
      }
    } catch (e) {
      console.error('Auth callback erro:', e);
      window.location.replace('login.html');
    }
  })();
</script>
</body>
</html>
