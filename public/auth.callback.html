<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>A autenticar...</title>
  <style>
    body { background:#444441; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; font-family:sans-serif; flex-direction:column; gap:1rem; color:white; }
    .spinner { width:40px; height:40px; border:4px solid rgba(255,255,255,0.2); border-top-color:#D85A30; border-radius:50%; animation:spin .7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    p { font-size:14px; color:rgba(255,255,255,0.6); margin:0; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p id="msg">A autenticar com Google...</p>

  <script>
    window.onload = function() {
      try {
        var params  = new URLSearchParams(window.location.search);
        var erro    = params.get('erro');

        if (erro) {
          var msgs = {
            google_cancelado: 'Login com Google cancelado.',
            google_falhou: 'Erro ao autenticar com Google.',
            pendente: 'A sua conta aguarda aprovacao.'
          };
          alert(msgs[erro] || 'Erro de autenticacao.');
          window.location.href = 'login.html';
          return;
        }

        var token   = params.get('token');
        var nome    = decodeURIComponent(params.get('nome') || '');
        var email   = decodeURIComponent(params.get('email') || '');
        var role    = params.get('role') || 'usuario';
        var tipo    = params.get('tipo') || 'cliente';
        var id      = params.get('id') || '0';
        var destino = decodeURIComponent(params.get('destino') || '/index.html');

        if (!token) {
          window.location.href = 'login.html';
          return;
        }

        // Escrever no localStorage
        localStorage.setItem('token', token);
        localStorage.setItem('authToken', token);
        localStorage.setItem('usuarioLogado', nome);
        localStorage.setItem('role', role);
        localStorage.setItem('user', JSON.stringify({
          id: parseInt(id),
          nome: nome,
          email: email,
          role: role,
          tipo: tipo,
          status: 'aprovado'
        }));

        document.getElementById('msg').textContent = 'Bem-vindo, ' + nome + '!';

        // Aguardar 500ms e verificar antes de redirecionar
        setTimeout(function() {
          var check = localStorage.getItem('token');
          if (check) {
            // Usar formulário hidden para evitar problemas de replace
            var dest = destino.replace(/^\//, '');
            window.location.href = '/' + dest;
          } else {
            document.getElementById('msg').textContent = 'Erro ao guardar sessao. Tente novamente.';
            setTimeout(function() { window.location.href = 'login.html'; }, 2000);
          }
        }, 500);

      } catch(e) {
        console.error('Callback erro:', e);
        window.location.href = 'login.html';
      }
    };
  </script>
</body>
</html>
