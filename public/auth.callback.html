<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBRAVIA — A autenticar...</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #444441;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1.5rem;
      color: white;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #D85A30;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-family: 'Syne', sans-serif; font-size: 1.2rem; font-weight: 700; }
    p  { font-size: 13px; color: rgba(255,255,255,0.55); }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>A autenticar com Google...</h2>
  <p>Aguarde um momento</p>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const erro   = params.get('erro');

      if (erro) {
        const msgs = {
          google_cancelado: 'Login com Google cancelado.',
          google_falhou:    'Erro ao autenticar com Google. Tente novamente.',
          pendente:         'A sua conta ainda está a aguardar aprovação.'
        };
        alert(msgs[erro] || 'Erro de autenticação.');
        window.location.href = 'login.html';
        return;
      }

      const token  = params.get('token');
      const nome   = params.get('nome');
      const role   = params.get('role');
      const tipo   = params.get('tipo');
      const id     = params.get('id');
      const destino = params.get('destino') || 'index.html';

      if (!token) {
        window.location.href = 'login.html';
        return;
      }

      // Guardar sessão
      localStorage.setItem('token',         token);
      localStorage.setItem('authToken',     token);
      localStorage.setItem('usuarioLogado', decodeURIComponent(nome || ''));
      localStorage.setItem('role',          role || '');
      localStorage.setItem('user', JSON.stringify({
        id:    parseInt(id),
        nome:  decodeURIComponent(nome || ''),
        role:  role || 'usuario',
        tipo:  tipo || 'cliente',
        status: 'aprovado'
      }));

      // Redirecionar
      window.location.href = decodeURIComponent(destino);
    })();
  </script>
</body>
</html>
