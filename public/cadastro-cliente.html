<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="img/LOGO.png" type="image/x-icon">
  <title>OBRAVIA — Criar conta de Cliente</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --laranja: #D85A30; --laranja-escuro: #993C1D;
      --laranja-claro: #FAECE7;
      --cinza-claro: #F1EFE8; --cinza-texto: #444441;
      --cinza-suave: #D3D1C7; --branco: #ffffff;
      --verde: #3B6D11; --verde-claro: #EAF3DE;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cinza-texto);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed; top: -200px; right: -200px;
      width: 500px; height: 500px; border-radius: 50%;
      background: radial-gradient(circle, rgba(59,109,17,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      background: var(--branco);
      border-radius: 20px;
      width: 100%; max-width: 420px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,0.3);
      animation: fadeUp 0.5s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* TOPO VERDE */
    .card-top {
      background: linear-gradient(135deg, var(--verde) 0%, #4E8A16 100%);
      padding: 2rem 2rem 1.8rem;
      color: white;
      position: relative;
      overflow: hidden;
    }
    .card-top::after {
      content: '👤';
      position: absolute;
      right: 1.5rem; top: 1.2rem;
      font-size: 3rem; opacity: 0.15;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; color: rgba(255,255,255,0.65);
      text-decoration: none; margin-bottom: 1rem;
      transition: color 0.15s;
    }
    .back-link:hover { color: white; }
    .card-top h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem; font-weight: 800;
      margin-bottom: 0.3rem;
    }
    .card-top p { font-size: 13px; opacity: 0.75; }

    /* FORMULÁRIO */
    .card-body { padding: 2rem; }

    .form-group { margin-bottom: 1.2rem; }
    label {
      display: block; font-size: 13px; font-weight: 600;
      color: var(--cinza-texto); margin-bottom: 6px;
    }
    label .req { color: var(--laranja); }

    input {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid var(--cinza-suave);
      border-radius: 9px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px; color: var(--cinza-texto);
      background: #FAFAF7; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: var(--verde);
      box-shadow: 0 0 0 3px rgba(59,109,17,0.1);
      background: white;
    }

    /* Senha com toggle */
    .input-wrap { position: relative; }
    .input-wrap input { padding-right: 44px; }
    .toggle-senha {
      position: absolute; right: 13px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      cursor: pointer; font-size: 1rem;
      color: #aaa; padding: 0;
      transition: color 0.15s;
    }
    .toggle-senha:hover { color: var(--verde); }

    /* Barra de força da senha */
    .forca-wrap { margin-top: 6px; display: flex; gap: 4px; }
    .forca-barra {
      flex: 1; height: 3px; border-radius: 3px;
      background: var(--cinza-suave);
      transition: background 0.3s;
    }
    .forca-barra.ativa.fraca  { background: #EF4444; }
    .forca-barra.ativa.media  { background: #F59E0B; }
    .forca-barra.ativa.forte  { background: var(--verde); }
    .forca-label { font-size: 11px; color: #aaa; margin-top: 3px; }

    /* Mensagem de erro */
    .msg-erro {
      background: #FEF2F2; border: 1px solid #FECACA;
      color: #DC2626; border-radius: 8px;
      padding: 10px 13px; font-size: 13px;
      margin-bottom: 1rem; display: none;
    }
    .msg-erro.visivel { display: block; }

    /* Botão */
    .btn-cadastrar {
      width: 100%; padding: 13px;
      background: var(--verde); color: white;
      border: none; border-radius: 9px;
      font-family: 'Syne', sans-serif;
      font-size: 15px; font-weight: 700;
      cursor: pointer; margin-top: 0.5rem;
      transition: background 0.2s, transform 0.1s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-cadastrar:hover { background: #2E5A0D; transform: translateY(-1px); }
    .btn-cadastrar:disabled { background: #aaa; transform: none; cursor: not-allowed; }

    /* Footer do card */
    .card-footer {
      padding: 1.2rem 2rem;
      border-top: 1px solid var(--cinza-claro);
      text-align: center;
      font-size: 13px; color: #999;
    }
    .card-footer a {
      color: var(--verde); font-weight: 600;
      text-decoration: none;
    }
    .card-footer a:hover { text-decoration: underline; }

    /* Termos */
    .termos {
      font-size: 11px; color: #bbb;
      text-align: center; margin-top: 0.8rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- TOPO -->
    <div class="card-top">
      <a class="back-link" href="welcome.html">← Voltar</a>
      <h1>Criar conta de Cliente</h1>
      <p>Junte-se à OBRAVIA e encontre engenheiros verificados</p>
    </div>

    <!-- BODY -->
    <div class="card-body">
      <div class="msg-erro" id="msgErro"></div>

      <div class="form-group">
        <label>Nome completo <span class="req">*</span></label>
        <input type="text" id="nome" placeholder="O seu nome completo" autocomplete="name">
      </div>

      <div class="form-group">
        <label>Email <span class="req">*</span></label>
        <input type="email" id="email" placeholder="email@exemplo.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label>Senha <span class="req">*</span></label>
        <div class="input-wrap">
          <input type="password" id="senha" placeholder="Mínimo 6 caracteres" autocomplete="new-password" oninput="verificarForca(this.value)">
          <button class="toggle-senha" type="button" onclick="toggleSenha()" id="toggleBtn">👁</button>
        </div>
        <div class="forca-wrap">
          <div class="forca-barra" id="b1"></div>
          <div class="forca-barra" id="b2"></div>
          <div class="forca-barra" id="b3"></div>
        </div>
        <div class="forca-label" id="forcaLabel"></div>
      </div>

      <button class="btn-cadastrar" id="btnCadastrar" onclick="cadastrar()">
        Criar conta →
      </button>

      <p class="termos">Ao criar conta, aceita os Termos de Uso da OBRAVIA.</p>
    </div>

    <!-- FOOTER -->
    <div class="card-footer">
      Já tem conta? <a href="login.html">Entrar agora</a>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script>
    function toggleSenha() {
      const input = document.getElementById('senha');
      const btn   = document.getElementById('toggleBtn');
      if (input.type === 'password') { input.type = 'text';     btn.textContent = ''; }
      else                           { input.type = 'password'; btn.textContent = ''; }
    }

    function verificarForca(v) {
      const b1 = document.getElementById('b1');
      const b2 = document.getElementById('b2');
      const b3 = document.getElementById('b3');
      const lbl = document.getElementById('forcaLabel');
      [b1,b2,b3].forEach(b => { b.className = 'forca-barra'; });

      if (!v) { lbl.textContent = ''; return; }
      const forte = v.length >= 8 && /[A-Z]/.test(v) && /[0-9]/.test(v);
      const media = v.length >= 6;

      if (forte) {
        [b1,b2,b3].forEach(b => b.classList.add('ativa','forte'));
        lbl.textContent = 'Senha forte'; lbl.style.color = '#3B6D11';
      } else if (media) {
        b1.classList.add('ativa','media'); b2.classList.add('ativa','media');
        lbl.textContent = ' Senha média'; lbl.style.color = '#B45309';
      } else {
        b1.classList.add('ativa','fraca');
        lbl.textContent = ' Senha fraca'; lbl.style.color = '#DC2626';
      }
    }

    function mostrarErro(msg) {
      const el = document.getElementById('msgErro');
      el.textContent = msg;
      el.classList.add('visivel');
    }
    function esconderErro() {
      document.getElementById('msgErro').classList.remove('visivel');
    }

    async function cadastrar() {
      esconderErro();
      const nome  = document.getElementById('nome').value.trim();
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;

      if (!nome)              return mostrarErro('Por favor insira o seu nome.');
      if (!email)             return mostrarErro('Por favor insira o seu email.');
      if (senha.length < 6)  return mostrarErro('A senha deve ter pelo menos 6 caracteres.');

      const btn = document.getElementById('btnCadastrar');
      btn.textContent = 'A criar conta...';
      btn.disabled = true;

      try {
        const BASE = (typeof API_URL !== 'undefined' ? API_URL : 'http://localhost:3000/api');
        const res = await fetch(`${BASE}/cadastro/cliente`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, email, senha })
        });

        const data = await res.json();

        if (!res.ok) {
          mostrarErro(data.error || 'Erro ao criar conta. Tente novamente.');
          btn.textContent = 'Criar conta →'; btn.disabled = false;
          return;
        }

        // Guardar sessão e redirecionar
        localStorage.setItem('token', data.token);
        localStorage.setItem('authToken', data.token);
        localStorage.setItem('usuarioLogado', data.user.nome);
        localStorage.setItem('user', JSON.stringify(data.user));
        localStorage.setItem('role', data.user.role);

        window.location.href = 'index.html';

      } catch (err) {
        mostrarErro('Não foi possível ligar ao servidor. Verifique a sua ligação.');
        btn.textContent = 'Criar conta →'; btn.disabled = false;
      }
    }

    // Enter para submeter
    document.addEventListener('keydown', e => { if (e.key === 'Enter') cadastrar(); });
  </script>
</body>
</html>
